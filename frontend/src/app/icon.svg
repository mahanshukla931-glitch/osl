<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Badge (Ensures clear visibility on both light and dark browser tabs) -->
  <rect width="100" height="100" rx="24" fill="#090d16" stroke="#1e293b" stroke-width="2" />
  
  <g filter="url(#glow)">
    <!-- 1. Blue Circle -->
    <circle cx="23" cy="50" r="12" fill="#2563EB" />

    <!-- 2. Red Square with white slash -->
    <rect x="40" y="38" width="24" height="24" rx="5" fill="#DC2626" />
    <line x1="45" y1="57" x2="59" y2="43" stroke="white" stroke-width="3.5" stroke-linecap="round" />

    <!-- 3. Yellow/Amber Triangle -->
    <path d="M71 38 L93 62 H71 Z" fill="#F59E0B" />
  </g>
</svg>