version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opensense_mcp_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=OpenSense Labs MCP Hub
      - ORGANIZATION_NAME=OpenSense Labs
      - ORGANIZATION_DOMAIN=opensenselabs.com
      - SECRET_KEY=opensense_prod_secret_key_super_secure_2026_jwt_token!
      - ENCRYPTION_KEY=D7p0VdG4b8-fLh_sUoV2xQ8uB0gM3kY7lI1rN9wE5aM=
      - DATABASE_URL=sqlite+aiosqlite:///./opensense_mcp.db
    volumes:
      - backend_data:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opensense_mcp_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
    depends_on:
      - backend

volumes:
  backend_data:
